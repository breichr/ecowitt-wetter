# Für Coolify (Build Pack „Docker Compose“). Lokal mit freigegebenem Port:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - STATION_NAME=${STATION_NAME:-Wetterstation}
      - STATION_ELEVATION_M=${STATION_ELEVATION_M:-0}
      - ECOWITT_PASSKEY=${ECOWITT_PASSKEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - INGEST_HOST=${INGEST_HOST:-}
      - TZ=${TZ:-Europe/Vienna}
    volumes:
      - wetter-data:/data
    # Kein Host-Port: In Coolify routet Traefik über die Domain auf Container-Port 3000.
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  wetter-data:
